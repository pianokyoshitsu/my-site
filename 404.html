<!DOCTYPE HTML>
<html lang="ja">
	<head>
		<title>ページが見つかりません｜石原菜々子 ピアノ教室</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<style>
			body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f2ea;color:#33272b;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;text-align:center;word-break:keep-all;overflow-wrap:break-word}
			.box{padding:2rem}
			/* ひとまとまり：入りきらないときだけ中で折る（枠からはみ出さない） */
			.ph{display:inline-block;max-width:100%}
			/* 幅320〜360pxでも「見つかりませんでした」を1行に収める（文節の途中で折らない） */
			@media (max-width:360px){.box{padding:2rem 1rem}}
			h1{font-size:1.6rem;font-weight:600;letter-spacing:.08em;margin:0 0 .75rem}
			p{color:#6b5a5f;line-height:1.9;margin:0 0 1.5rem}
			a{display:inline-block;padding:.8em 2.2em;border-radius:999px;background:#a8465c;color:#fff;text-decoration:none;letter-spacing:.1em;font-family:sans-serif;font-size:.9rem}
			.keys{display:flex;justify-content:center;gap:2px;margin-bottom:1.5rem}
			.keys span{width:14px;height:44px;background:#fff;border:1px solid #d8ccc2;border-radius:0 0 3px 3px}
			.keys span.b{background:#33272b;height:28px;width:10px;border:none;margin:0 -6px;z-index:1;border-radius:0 0 2px 2px}
		</style>
	</head>
	<body>
		<div class="box">
			<div class="keys" aria-hidden="true"><span></span><span class="b"></span><span></span><span class="b"></span><span></span><span></span><span class="b"></span><span></span><span class="b"></span><span></span><span class="b"></span><span></span></div>
			<h1>ページが<wbr><span class="ph">見つかり<wbr>ませんでした</span></h1>
			<p>お探しのページは<wbr>移動または<wbr>削除された<wbr>可能性があります。</p>
			<a href="/">トップページへ戻る</a>
		</div>
	</body>
</html>
